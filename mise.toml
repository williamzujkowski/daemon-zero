# Pinned toolchain. `mise install` gives every machine and CI the same versions.
# Versions were checked against upstream releases on 2026-11-16
# (docs/REVIEW-CURRENCY-2026-11-16.md records what was looked up and why each hold stands).

[tools]
# Node 26 "Lithium" is the active LTS line (LTS since 2026-10-28, maintenance from 2027-10-20,
# end of life 2029-04-30). Expo SDK 58, React Native 0.88, Metro, Vitest 5, ESLint 10 and
# Playwright all declare support for it in `engines`. Node 24 is the maintenance LTS; package.json
# `engines` still admits it. See docs/REVIEW-CURRENCY-2026-11-16.md.
node = "26.13.1"
# pnpm 12 is the current major (12.21.0 was npm `latest` on 2026-11-16). Its settings live in
# pnpm-workspace.yaml. Keep `packageManager` in package.json in step, then run `pnpm install`
# so the boot document of pnpm-lock.yaml records the same version; a frozen install fails
# when they differ.
pnpm = "12.21.0"

# Security tooling used by `make security` and `make sbom`.
gitleaks = "8.30.1"
osv-scanner = "2.7.1"
trivy = "0.76.2"

# JDK used by Android command-line tools and native builds. Temurin 25 is the newer LTS, but
# React Native 0.88 documents JDK 17 and warns about higher versions; 21 is the version the
# recorded native builds used. Do not move it without a native rebuild and a device run.
java = "temurin-21.0.13+9.0.LTS"

[settings]
# Record exact resolved versions and checksums in mise.lock; commit that file.
lockfile = true
