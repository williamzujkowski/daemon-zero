name: live-journey

# The full live end-to-end journey: a fresh profile on a running clock, played through the UI to
# an ending on phone and desktop, once at the root (`make e2e-live`) and once under the GitHub
# Pages subpath the site is deployed at (`make e2e-live-pages`). Each takes about five minutes, so
# they run nightly and on demand instead of inside the `ci` job. A failure here means the shipped
# web build no longer plays through; it is a report, not a merge gate.
on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

# Reads the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: live-journey
  cancel-in-progress: true

jobs:
  journey:
    name: live journey
    runs-on: ubuntu-26.04
    # Two journeys of up to 18 minutes each plus setup.
    timeout-minutes: 45
    steps:
      # Third-party actions are pinned by commit SHA; the comment records the tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain (mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Install dependencies
        run: make setup

      - name: Install E2E browser
        id: browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Live journey at the root, fresh profile to an ending
        # Below the job limit, so a hung journey fails this step (and the upload below still
        # runs) instead of the whole job being cancelled with nothing kept.
        timeout-minutes: 18
        run: make e2e-live

      # Uploaded before the Pages run, because Playwright empties test-results/ when it starts.
      - name: Upload the root run's failure screenshot and results
        # Not `failure()` alone: a timed-out or cancelled run is exactly when this is needed.
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-journey-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Live journey under the Pages subpath, fresh profile to an ending
        id: pages
        # Runs whether or not the root journey passed: the two answer different questions.
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        timeout-minutes: 18
        run: make e2e-live-pages

      - name: Upload the Pages run's failure screenshot and results
        if: ${{ always() && (steps.pages.outcome == 'failure' || steps.pages.outcome == 'cancelled') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-journey-pages-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
