name: codeql

# Static analysis of the application source and of the workflows themselves.
# Added on explicit maintainer instruction (2026-11-16); it complements, and does
# not replace, the scanners that `make security` runs in ci.yml.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new queries reach code that has not changed.
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Needed to upload results to code scanning; nothing else is granted.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      # Third-party actions are pinned by commit SHA; the comment records the tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          # Neither language needs a build: the source is analysed as written.
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - reference
              - dist
              - coverage

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
