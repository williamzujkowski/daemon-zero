name: ci

on:
  push:
    branches: [main]
  pull_request:

# Verification only reads the repository; the separate Pages job can deploy.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Independent legs run in parallel; the required check `verify` (below) passes only when all of them do.
  # One serial job measured 21-30+ min against a 30 min limit (#397 era), mostly two browser suites in a row.
  # 2026-11-22: the unit suite (349 s of the 395 s `make verify` step) is sharded three ways with its coverage merged
  # and gated once, the Pages E2E (496 s, unsharded) two ways and the main E2E three ways, and the Playwright browser
  # download is cached; the critical path was about 9.5 min.
  checks:
    name: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned by commit SHA; the comment records the tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history
          persist-credentials: false

      # Also installs ffmpeg and ffprobe (conda-forge, pinned in mise.toml and mise.lock). The
      # action caches the mise data directory under a key that hashes mise.toml and mise.lock, so
      # a run with an unchanged toolchain restores them instead of downloading anything.
      - name: Install pinned toolchain (mise.toml)
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      # tests/audio-assets.spec.ts measures the committed audio with ffmpeg and ffprobe, and fails
      # rather than skips when CI is set and they are missing. This fails earlier, and also if a
      # copy on the runner image shadows the pinned one.
      - name: Check ffmpeg and ffprobe are the mise.toml pin
        run: |
          for tool in ffmpeg ffprobe; do
            test "$(command -v "$tool")" = "$(mise which "$tool")" || { echo "::error::$tool on PATH is $(command -v "$tool" || echo missing), not the mise.toml pin"; exit 1; }
            "$tool" -hide_banner -version | head -n 1
          done

      - name: Install dependencies
        run: make setup

      # `make verify` without its unit suite, which the unit and unit-coverage jobs run sharded and gate on merged coverage.
      - name: Typecheck, lint, content, balance, web export
        run: make typecheck lint validate sim build-web

      - name: Security scans
        run: make security

      - name: SBOM
        run: make sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  # The unit suite in three shards. Each records its tests and coverage in a Vitest blob report; per-shard thresholds
  # would judge a third of the code, so VITEST_SHARD_RUN leaves them to the merged report (vitest.config.mts).
  unit:
    name: unit (${{ matrix.shard }}/3)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain (mise.toml)
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Install dependencies
        run: make setup

      - name: Unit tests (shard)
        env:
          VITEST_SHARD_RUN: '1'
        run: pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/3 --reporter=blob

      # Also when the shard failed: the blob report is the only record of which test failed or timed out (#505).
      - name: Upload the shard's blob report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  # Merges the three blob reports: every test's result and the whole suite's coverage, with the vitest.config.mts
  # thresholds enforced exactly as `make test` enforces them.
  # It runs after a failed shard too, so its log names the failing test from the uploaded blobs; it then fails, and so
  # does `verify`, which needs every leg to succeed (#505).
  unit-coverage:
    name: unit coverage
    needs: unit
    if: success() || failure()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain (mise.toml)
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Install dependencies
        run: make setup

      - name: Download the blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: .vitest/blob/
          merge-multiple: true

      - name: Merged results and coverage thresholds
        run: pnpm exec vitest run --merge-reports --coverage

  # `make e2e` split across four runners with Playwright's built-in sharding (three measured 299-322 s each, #438).
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain (mise.toml)
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Install dependencies
        run: make setup

      # The browser download is keyed on the lockfile, which pins Playwright; --with-deps still installs the system
      # libraries, so a hit skips only the download.
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install E2E browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Production web E2E
        run: make e2e E2E_ARGS="--shard=${{ matrix.shard }}/4"

      # The stage atlas's gallery and per-cell evidence from `make e2e` (#341), one part per shard; link it in UI PRs.
      - name: Upload the stage atlas gallery
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-atlas-${{ matrix.shard }}
          path: test-results/ui-atlas/
          if-no-files-found: warn
          retention-days: 7

  # `make e2e-pages` (every scenario under the Pages base path) split across three runners (two measured 288 and 392 s, #438). Each shard exports the whole
  # site; the first uploads it for deployment.
  pages:
    name: pages (${{ matrix.shard }}/3)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain (mise.toml)
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Install dependencies
        run: make setup

      # The browser download is keyed on the lockfile, which pins Playwright; --with-deps still installs the system
      # libraries, so a hit skips only the download.
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install E2E browser
        run: pnpm exec playwright install --with-deps chromium

      - name: GitHub Pages production web E2E
        run: make e2e-pages E2E_ARGS="--shard=${{ matrix.shard }}/3"

      - name: Upload tested Pages export
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/daemon-zero

  # The required status check. Its name is unchanged, so branch protection and the deploy gate keep working;
  # it fails unless every leg succeeded (a skipped, failed, cancelled or timed-out leg is not a pass). It runs even
  # when the run is cancelled, so a cancelled run leaves a failed `verify`, never a skipped one: GitHub can treat a
  # skipped required check as satisfied (#398 panel). A superseded commit's failed verdict is never merged anyway.
  verify:
    name: verify
    if: ${{ always() }}
    needs: [checks, unit, unit-coverage, e2e, pages]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: All legs passed
        env:
          RESULTS: ${{ needs.checks.result }} ${{ needs.unit.result }} ${{ needs['unit-coverage'].result }} ${{ needs.e2e.result }} ${{ needs.pages.result }}
        run: |
          echo "checks unit unit-coverage e2e pages: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success || { echo "::error::a verification leg did not succeed ($RESULTS)"; exit 1; }
          done

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested export
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
