name: ci

on:
  push:
    branches: [main]
  pull_request:

# Verification only reads the repository; the separate Pages job can deploy.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned by commit SHA; the comment records the tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history
          persist-credentials: false

      - name: Install pinned toolchain (mise.toml)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install dependencies
        run: make setup

      - name: Typecheck, lint, content, tests, balance
        run: make verify

      - name: Install E2E browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Production web E2E
        run: make e2e

      - name: Security scans
        run: make security

      - name: SBOM
        run: make sbom

      - name: GitHub Pages production web E2E
        run: make e2e-pages

      - name: Upload tested Pages export
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/daemon-zero

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested export
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
