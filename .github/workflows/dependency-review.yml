name: dependency-review

# Reviews what a pull request changes in the dependency tree before it merges: known
# vulnerabilities in anything added or bumped, and licenses that do not fit an MIT project.
# Added on explicit maintainer instruction (2026-11-16). It complements `make security`,
# which scans the whole tree on every run, by naming the change that introduced a problem.
on:
  pull_request:

# Reads the repository and nothing else. No comment is posted, so no write scope is needed.
permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned by commit SHA; the comment records the tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail on a newly introduced vulnerability of moderate severity or worse, in
          # runtime and development dependencies alike: the dev tree builds what ships.
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          # Copyleft and source-available licenses that AGENTS.md rules out for this repo.
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
          comment-summary-in-pr: never
