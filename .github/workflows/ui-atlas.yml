name: ui-atlas

# The stage atlas's full matrix (#341): every P1 stage at 390x844 and 1440x900 (the gated cells `make e2e` also
# runs) plus 360x640 and each stage's extra sizes, reported only (`make e2e-atlas`). It runs nightly and on
# demand; the gallery and the per-cell evidence the judgment panel reads are uploaded either way. A failure here
# means a gated cell regressed or a stage no longer opens; the matrix sizes never fail it on a gate.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Reads the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ui-atlas
  cancel-in-progress: true

jobs:
  atlas:
    name: stage atlas full matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned by commit SHA; the comment records the tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain (mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Install dependencies
        run: make setup

      - name: Install E2E browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Stage atlas, every stage at every size
        # Below the job limit, so a hung run fails this step and the upload below still runs.
        timeout-minutes: 20
        run: make e2e-atlas

      - name: Upload the atlas gallery and per-cell evidence
        # Not `failure()` alone: the gallery is the point of the run, pass or fail.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-atlas-matrix
          path: test-results/ui-atlas/
          if-no-files-found: warn
          retention-days: 7
